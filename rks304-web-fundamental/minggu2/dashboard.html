<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Admin Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">
  <header class="bg-indigo-600 text-white p-4 shadow flex justify-between items-center">
    <h1 class="text-xl font-bold">Admin Store</h1>
    <span class="text-sm">Halo, Admin</span>
  </header>
  
  <div class="flex flex-1">
    <aside class="w-64 bg-slate-800 text-slate-300 p-4 flex flex-col justify-between">
      <nav class="space-y-2">
        <a href="dashboard.html" class="block py-2 px-4 rounded bg-slate-700 text-white">Dashboard</a>
        <a href="products.html" class="block py-2 px-4 rounded hover:bg-slate-700 hover:text-white">Products</a>
        <a href="#" class="block py-2 px-4 rounded hover:bg-slate-700 hover:text-white">Users</a>
        <a href="#" class="block py-2 px-4 rounded hover:bg-slate-700 hover:text-white">Setting</a>
      </nav>
      <a href="index.html" class="block py-2 px-4 bg-red-600 text-white text-center rounded hover:bg-red-700 font-semibold">Logout</a>
    </aside>

    <main class="flex-1 p-6">
      <h2 class="text-2xl font-bold mb-6 text-slate-800">Dashboard</h2>
      
      <!-- 4 Card Statistik E-Commerce -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div class="bg-white p-5 rounded-xl shadow border-l-4 border-indigo-500">
          <p class="text-sm text-slate-500 font-medium">Total Penjualan</p>
          <p class="text-2xl font-bold text-slate-800 mt-1">Rp 124.500.000</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow border-l-4 border-green-500">
          <p class="text-sm text-slate-500 font-medium">Total Pesanan</p>
          <p class="text-2xl font-bold text-slate-800 mt-1">1,420</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow border-l-4 border-amber-500">
          <p class="text-sm text-slate-500 font-medium">Total Produk</p>
          <p class="text-2xl font-bold text-slate-800 mt-1">86</p>
        </div>
        <div class="bg-white p-5 rounded-xl shadow border-l-4 border-purple-500">
          <p class="text-sm text-slate-500 font-medium">Total Pelanggan</p>
          <p class="text-2xl font-bold text-slate-800 mt-1">350</p>
        </div>
      </div>
    </main>
  </div>

  <footer class="bg-slate-200 text-center py-3 text-sm text-slate-600 border-t">
    &copy; 2026 Admin Dashboard. All rights reserved.
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Admin Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">
  <header class="bg-indigo-600 text-white p-4 shadow flex justify-between items-center">
    <h1 class="text-xl font-bold">Admin Store</h1>
    <span class="text-sm">Halo, Admin</span>
  </header>
  
  <div class="flex flex-1">
    <aside class="w-64 bg-slate-800 text-slate-300 p-4 flex flex-col justify-between">
      <nav class="space-y-2">
        <a href="dashboard.html" class="block py-2 px-4 rounded hover:bg-slate-700 hover:text-white">Dashboard</a>
        <a href="products.html" class="block py-2 px-4 rounded bg-slate-700 text-white">Products</a>
        <a href="#" class="block py-2 px-4 rounded hover:bg-slate-700 hover:text-white">Users</a>
        <a href="#" class="block py-2 px-4 rounded hover:bg-slate-700 hover:text-white">Setting</a>
      </nav>
      <a href="index.html" class="block py-2 px-4 bg-red-600 text-white text-center rounded hover:bg-red-700 font-semibold">Logout</a>
    </aside>

    <main class="flex-1 p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Manajemen Produk</h2>
        <a href="add-produk.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 font-medium">+ Add Product</a>
      </div>

      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead class="bg-slate-50 border-b">
            <tr>
              <th class="p-3 text-sm font-semibold text-slate-600">No</th>
              <th class="p-3 text-sm font-semibold text-slate-600">Name</th>
              <th class="p-3 text-sm font-semibold text-slate-600">Stock</th>
              <th class="p-3 text-sm font-semibold text-slate-600">Action</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 text-slate-700">
            <tr>
              <td class="p-3">1</td>
              <td class="p-3 font-medium">Laptop Gaming LOQ</td>
              <td class="p-3">15</td>
              <td class="p-3 space-x-2">
                <a href="edit-produk.html" class="text-blue-600 hover:underline text-sm font-medium">Edit</a>
                <a href="#" class="text-red-600 hover:underline text-sm font-medium">Delete</a>
              </td>
            </tr>
            <tr>
              <td class="p-3">2</td>
              <td class="p-3 font-medium">Mouse Wireless</td>
              <td class="p-3">40</td>
              <td class="p-3 space-x-2">
                <a href="edit-produk.html" class="text-blue-600 hover:underline text-sm font-medium">Edit</a>
                <a href="#" class="text-red-600 hover:underline text-sm font-medium">Delete</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <footer class="bg-slate-200 text-center py-3 text-sm text-slate-600 border-t">
    &copy; 2026 Admin Dashboard. All rights reserved.
  </footer>
</body>
</html>
